name: Build and Push Docker Images

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('docker-pr-{0}', github.event.pull_request.number) || 'docker-publish' }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    uses: ./.github/workflows/tests.yml

  prepare:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.vars.outputs.publish }}
      image_repo: ${{ steps.vars.outputs.image_repo }}
      version: ${{ steps.vars.outputs.version }}
      short_sha: ${{ steps.vars.outputs.short_sha }}
      ref_name_safe: ${{ steps.vars.outputs.ref_name_safe }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Prepare variables
        id: vars
        shell: bash
        run: |
          IMAGE_REPO=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          SHORT_SHA="${GITHUB_SHA::7}"
          REF_NAME_SAFE=$(echo "${{ github.ref_name }}" | tr '[:upper:]' '[:lower:]' | sed 's#[^a-z0-9._-]#-#g')

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            PUBLISH=false
          else
            PUBLISH=true
          fi

          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION="$(date -u +'%Y.%m.%d-%H%M%S')-${{ github.run_number }}-${SHORT_SHA}"
          fi

          echo "publish=$PUBLISH" >> "$GITHUB_OUTPUT"
          echo "image_repo=$IMAGE_REPO" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"
          echo "ref_name_safe=$REF_NAME_SAFE" >> "$GITHUB_OUTPUT"

      - name: Debug info
        run: |
          echo "event_name=${{ github.event_name }}"
          echo "github.ref=${{ github.ref }}"
          echo "github.ref_name=${{ github.ref_name }}"
          echo "publish=${{ steps.vars.outputs.publish }}"
          echo "image_repo=${{ steps.vars.outputs.image_repo }}"
          echo "version=${{ steps.vars.outputs.version }}"
          echo "short_sha=${{ steps.vars.outputs.short_sha }}"

  build:
    needs: [prepare, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service:
          - file_watcher
          - pdf_processor
          - xslt_processor
          - api_processor

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: needs.prepare.outputs.publish == 'true'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare tags
        id: tags
        shell: bash
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ needs.prepare.outputs.image_repo }}/${{ matrix.service }}"

          TAGS="${IMAGE}:${{ needs.prepare.outputs.version }}"


          {
            echo "tags<<EOF"
            echo "$TAGS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          echo "Final tags:"
          echo "$TAGS"

      - name: Build and optionally push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile-${{ matrix.service }}
          push: ${{ needs.prepare.outputs.publish == 'true' }}
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
          build-args: |
            BUILD_CONFIGURATION=Release
            VERSION=${{ needs.prepare.outputs.version }}
          labels: |
            org.opencontainers.image.title=${{ matrix.service }}
            org.opencontainers.image.description=${{ matrix.service }} service image
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}

  promote:
    needs: [prepare, build]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Promote all successfully built images
        env:
          IMAGE_REPO: ${{ needs.prepare.outputs.image_repo }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          for service in file_watcher pdf_processor xslt_processor api_processor; do
            image="ghcr.io/$IMAGE_REPO/$service"
            docker buildx imagetools inspect "$image:$VERSION" >/dev/null
          done
          for service in file_watcher pdf_processor xslt_processor api_processor; do
            image="ghcr.io/$IMAGE_REPO/$service"
            docker buildx imagetools create --tag "$image:latest" "$image:$VERSION"
          done
          echo "Published $VERSION and latest" >> "$GITHUB_STEP_SUMMARY"

  release:
    needs: [prepare, promote]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') && needs.promote.result == 'success'
    permissions:
      contents: write
    steps:
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          generate_release_notes: true
